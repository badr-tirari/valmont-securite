# Portail patient du Laboratoire Valmont — configuration TLS conforme à la politique interne.
#
#   1. TLS 1.2 et 1.3 uniquement
#   2. suites AEAD uniquement (AES-GCM, ChaCha20-Poly1305), échange de clé ECDHE (confidentialité persistante)
#   3. HSTS avec includeSubDomains
#   4. toute requête HTTP redirigée vers HTTPS
#   5. certificat Let's Encrypt, renouvellement automatisé (voir ../certbot/)
#
# Cible : nginx ≥ 1.25.1 (directive « http2 on »). Testé avec nginx 1.27.

# ---------------------------------------------------------------------------------- port 80
server {
    listen 80;
    listen [::]:80;
    server_name portail.labo-valmont.fr;

    # Seule exception au tout-HTTPS : le défi ACME de Let's Encrypt (renouvellement, point 5).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Point 4 : redirection permanente. Nom d'hôte FIXE, et non $host : on ne renvoie pas
    # le client vers un nom fourni par l'en-tête Host d'un attaquant.
    location / {
        return 301 https://portail.labo-valmont.fr$request_uri;
    }
}

# --------------------------------------------------------------------------------- port 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portail.labo-valmont.fr;

    # Point 5 : certificat Let's Encrypt (clé ECDSA P-256), renouvelé par certbot.
    ssl_certificate     /etc/letsencrypt/live/portail.labo-valmont.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portail.labo-valmont.fr/privkey.pem;

    # Point 1 : versions. Liste explicite, jamais le défaut du serveur.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Point 2 : TLS 1.2 limité aux suites AEAD avec ECDHE.
    # (Les suites TLS 1.3 sont toutes AEAD par construction et ne dépendent pas de cette ligne.)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;          # toutes les suites sont fortes : on laisse le client choisir (ChaCha20 sur mobile)
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # Sessions : reprise via cache serveur ; tickets désactivés (leur clé, jamais tournée
    # par nginx, casserait la confidentialité persistante).
    ssl_session_cache shared:VALMONT_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Pas d'OCSP stapling : Let's Encrypt a arrêté son service OCSP le 6 août 2025
    # et ne publie plus d'URL OCSP dans ses certificats (révocation par CRL).

    # Point 3 : HSTS, deux ans, sous-domaines inclus. « always » : aussi sur les réponses d'erreur.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # En-têtes de défense complémentaires (hors politique, sans coût).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;                       # pas de version de nginx dans les réponses

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
