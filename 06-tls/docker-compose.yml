# Laboratoire TLS du portail Valmont — étape 6.
# nginx sert la configuration de PRODUCTION (nginx/portail-valmont.conf) sans modification ;
# seuls les certificats sont ceux de la mini-PKI de laboratoire (lab/certs), montés à
# l'emplacement exact où certbot rangerait ceux de Let's Encrypt.
services:
  portail:
    image: nginx:1.27-alpine
    container_name: valmont-portail
    volumes:
      - ./nginx/portail-valmont.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/certs/fullchain.pem:/etc/letsencrypt/live/portail.labo-valmont.fr/fullchain.pem:ro
      - ./lab/certs/privkey.pem:/etc/letsencrypt/live/portail.labo-valmont.fr/privkey.pem:ro
      - ./lab/site:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    networks:
      lab:
        aliases: [portail.labo-valmont.fr]   # le nom du certificat résout vers ce conteneur

  # Client de vérification : openssl + curl, sur le même réseau.
  # Lancement : docker compose run --rm verif
  verif:
    image: alpine:3.20
    profiles: ["verif"]
    depends_on: [portail]
    volumes:
      - ./lab:/lab:ro
    networks: [lab]
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache -q openssl curl >/dev/null && sh /lab/verifier_tls.sh portail.labo-valmont.fr /lab/certs/ca.pem"]

networks:
  lab:
